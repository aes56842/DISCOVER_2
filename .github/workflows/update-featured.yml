name: Update Featured Section

on:
  schedule:
    # Runs at the top of every hour (GitHub's cron is "best effort" —
    # usually within a few minutes of the hour, occasionally later).
    - cron: "0 * * * *"
  # Lets you trigger it manually from the Actions tab to test it any time.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-featured:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        run: python3 scripts/update_featured.py

      - name: Commit changes if anything updated
        run: |
          git config user.name "discover-featured-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- discover-media.html; then
            echo "No changes — featured section already up to date."
          else
            git add discover-media.html
            git commit -m "Auto-update Featured section [skip ci]"
            git push
          fi
